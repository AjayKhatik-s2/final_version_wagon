[pytest]
# Collected suites:
#   tests/                 wagon_eye_v4 integration + counting-swap regression
#   wagon_count/tests/     the counting engine's own suite, adopted with it
#
# Excluded:
#   *Copy_correct_count*   the reference folder the counting engine was adopted
#                          from.  Its tests are byte-identical copies of
#                          wagon_count/tests/, so collecting both makes pytest
#                          abort on duplicate module basenames.  Delete the
#                          folder once the swap has been reviewed.
#   _legacy_wagon_count_removed  dead pre-swap counting modules, review only.
#   batch_outputs/         per-run pipeline output.
norecursedirs =
    *Copy_correct_count*
    _legacy_wagon_count_removed
    batch_outputs
    local_inputs
    models
    __pycache__
    .git
